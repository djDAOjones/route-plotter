name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read
  # GATE-01: a push to main reads which of main's runs last passed.
  actions: read

# A newer push to a branch or pull request replaces the older run, which is
# safe because each run reads the whole change against main (GATE-01). Each
# run on main has a group of its own, so none is cancelled or replaced while
# it waits, and each reads everything since main's last passing run.
concurrency:
  group: verify-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source, with the history the sort reads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use pinned Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # STACK-02: v4's package and lockfile live at the root. Frozen v3's
          # suite runs in no lane (GATE-05, V3_LOCK in scripts/gate.mjs).
          cache-dependency-path: package-lock.json

      # GATE-01: a record-only change runs the record checker alone; anything
      # the sort cannot place, or cannot read, runs every lane.
      - name: Sort the change by what it touches
        id: sort
        run: node scripts/gate.mjs --ci --plan
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # STACK-02: v4's packages, from the committed lockfile, with install
      # scripts off. Carbon's and IBM Plex's run IBM's telemetry, which
      # collects in CI alone (the variable turns it off as well); the one
      # other, @parcel/watcher's, builds what npm installs prebuilt.
      - name: Install v4's dependencies
        if: steps.sort.outputs.v4 == 'true'
        run: npm ci --ignore-scripts
        env:
          IBM_TELEMETRY_DISABLED: 'true'

      # STACK-03: the accessibility run's browser, Chromium's headless shell at the
      # revision the locked Playwright names, fetched by Playwright's own installer
      # from its own download host; the run itself never downloads. Its folder is
      # outside the checkout and named for both steps, as the pack's run looks in
      # macOS's cache unless told. ubuntu-latest is Ubuntu 26.04, which the
      # pinned Playwright (1.56.1) does not name, so both steps take its Ubuntu
      # 24.04 build, the newest it supports; v3's lane is not touched.
      - name: Install Playwright's Chromium for the accessibility run
        if: steps.sort.outputs.v4 == 'true'
        run: node node_modules/@playwright/test/cli.js install --only-shell chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64

      - name: Test the gate's own sorting
        if: steps.sort.outputs.gate == 'true'
        run: node scripts/gate.mjs --lane gate

      # v4's gate from the root: typecheck, lint, boundaries, dead code, tests,
      # build, the player's check, the architecture's planted violations and the
      # player's closure, and the accessibility run at AAA with its planted
      # faults (npm run check:v4); a run over 10 minutes is reported as a
      # finding. STACK-04: then the measures, M1 to M11, with the lane's own time
      # as M9, printed into this run's summary whether the lane passed or not;
      # the step fails if either did. The build writes dist/, which git ignores;
      # the accessibility run writes only in the system's temporary folder. The
      # next step proves the checkout as git sees it, ignored paths included, is
      # as it was, dist/ aside, after a failing lane too.
      - name: Run v4's gate
        if: steps.sort.outputs.v4 == 'true'
        run: |
          git status --porcelain --ignored=matching --untracked-files=all | sed '/^!! dist\/$/d' > "$RUNNER_TEMP/checkout-before-v4"
          started=$(date +%s)
          gate=0; node scripts/gate.mjs --lane v4 || gate=$?
          measures=0; npm run measures -- --gate-seconds "$(( $(date +%s) - started ))" || measures=$?
          exit $(( gate || measures ))
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64

      - name: Prove v4's gate wrote nothing in the checkout
        if: ${{ !cancelled() && steps.sort.outputs.v4 == 'true' }}
        run: git status --porcelain --ignored=matching --untracked-files=all | sed '/^!! dist\/$/d' | diff "$RUNNER_TEMP/checkout-before-v4" -

      - name: Run the record checker
        run: node scripts/gate.mjs --lane record

      - name: Prove verification did not rewrite Pages output
        run: git diff --exit-code -- docs version.json v3/version.json
