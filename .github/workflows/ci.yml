name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read
  # GATE-01: a push to main reads which of main's runs last passed.
  actions: read

# A newer push to a branch or pull request replaces the older run, which is
# safe because each run reads the whole change against main (GATE-01). Each
# run on main has a group of its own, so none is cancelled or replaced while
# it waits, and each reads everything since main's last passing run.
concurrency:
  group: verify-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source, with the history the sort reads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use pinned Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # STACK-01: frozen v3's package and lockfile live in v3/.
          cache-dependency-path: v3/package-lock.json

      # GATE-01: a record-only change runs the record checker alone; anything
      # the sort cannot place, or cannot read, runs every lane.
      - name: Sort the change by what it touches
        id: sort
        run: node scripts/gate.mjs --ci --plan
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install frozen v3's dependencies
        if: steps.sort.outputs.install == 'true'
        working-directory: v3
        run: npm ci

      - name: Test the gate's own sorting
        if: steps.sort.outputs.gate == 'true'
        run: node scripts/gate.mjs --lane gate

      # The lane runs from v3/, where v3 builds into v3/docs/, which git ignores.
      - name: Run frozen v3's whole suite, shell contract and build check
        if: steps.sort.outputs.v3 == 'true'
        run: node scripts/gate.mjs --lane v3

      # STACK-02 fills v4's gate; a run over 10 minutes is reported as a finding.
      - name: Run v4's gate
        if: steps.sort.outputs.v4 == 'true'
        run: node scripts/gate.mjs --lane v4

      - name: Run the record checker
        run: node scripts/gate.mjs --lane record

      - name: Prove verification did not rewrite Pages output
        run: git diff --exit-code -- docs version.json v3/version.json
