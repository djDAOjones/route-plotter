<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Known-bad: a control needing timed keystrokes</title><style>body{font:16px/1.5 sans-serif;color:#111;background:#fff;margin:1rem}#count{min-height:48px;min-width:96px;font-size:16px}</style></head><body><main>
<h1>Timed keystrokes</h1><p>The counter rises only when Up is pressed twice within 400 ms (2.1.3).</p><button type="button" id="count" aria-describedby="n">Count</button> <output id="n">0</output>
<script>
let last=-Infinity;const c=document.getElementById("count"),n=document.getElementById("n");
c.addEventListener("keydown",(e)=>{if(e.key!=="ArrowUp")return;e.preventDefault();const t=performance.now();if(t-last<400){n.textContent=String(Number(n.textContent)+1);last=-Infinity;}else last=t;});
</script>
</main></body></html>
