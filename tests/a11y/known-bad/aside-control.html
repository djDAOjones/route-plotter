<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Known-bad: a control's graphic set aside</title><style>body{font:16px/1.5 sans-serif;color:#111;background:#fff;margin:1rem}.region canvas{display:block;width:120px;height:80px;margin:.5rem 0}.region button{display:block;padding:4px;border:2px solid #111;background:#fff}.region button canvas{width:40px;height:40px;margin:0}</style></head><body><main>
<h1>A control's graphic set aside</h1><p>The region below is declared set aside with a count of one: it holds one named canvas, and a button whose only content is a canvas. 1.4.11 must fail on the button's graphic.</p>
<div class="region"><canvas role="img" aria-label="The picture" width="120" height="80"></canvas><button type="button" id="zoom" aria-label="Zoom in"><canvas width="40" height="40"></canvas></button></div>
</main><script>for (const c of document.querySelectorAll('canvas')) { const x = c.getContext('2d'); x.fillStyle = '#3a6ea5'; x.fillRect(4, 4, c.width - 8, c.height - 8); }</script></body></html>
